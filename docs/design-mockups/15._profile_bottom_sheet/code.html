<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gate Validator - Profile Bottom Sheet</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#0D141E',
            appCardDark: '#121D2C',
            appSurface: '#162335',
            appAccent: '#E5A93C',
            appBorder: '#1F2E43',
            appSubtext: '#7E8B9B',
            appGreen: '#10B981',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* iOS frame setup and modal styling */
    body {
      background-color: #05090E;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
    }

    .device-shell {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: #0D141E;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 10px #1e2633;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-500/20">
<!-- BEGIN: DeviceContainer -->
<main class="device-shell" data-purpose="ios-mobile-screen">
<!-- BEGIN: BackgroundScreenSimulation -->
<!-- Dimmed & blurred representation of active checkpoint dashboard behind the sheet -->
<div class="absolute inset-0 bg-[#0A1017] p-5 flex flex-col justify-between opacity-35 filter blur-[2px] pointer-events-none select-none" data-purpose="background-context">
<!-- Simulated Dashboard Header -->
<div class="pt-10 flex justify-between items-center">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-slate-700"></div>
<div>
<div class="h-3 w-16 bg-slate-700 rounded mb-1.5"></div>
<div class="h-4 w-24 bg-slate-600 rounded"></div>
</div>
</div>
<div class="h-5 w-14 bg-emerald-950/60 rounded-full border border-emerald-500/30"></div>
</div>
<!-- Simulated Dashboard Metrics -->
<div class="space-y-4 my-auto">
<div class="h-28 bg-[#14202E] rounded-2xl border border-[#1e2e42]"></div>
<div class="grid grid-cols-2 gap-3">
<div class="h-24 bg-[#14202E] rounded-2xl border border-[#1e2e42]"></div>
<div class="h-24 bg-[#14202E] rounded-2xl border border-[#1e2e42]"></div>
</div>
</div>
<!-- Simulated Bottom Nav -->
<div class="h-16 bg-[#111A26] rounded-3xl border border-[#1e2d40] mb-3"></div>
</div>
<!-- END: BackgroundScreenSimulation -->
<!-- BEGIN: ScrimOverlay -->
<!-- Translucent dark backdrop emphasizing the bottom sheet modal -->
<div class="absolute inset-0 bg-black/60 transition-opacity" data-purpose="scrim-overlay"></div>
<!-- END: ScrimOverlay -->
<!-- BEGIN: StatusBar -->
<!-- iOS Standard Status Bar (9:41, Network, Wifi, Battery) -->
<header class="relative z-30 flex justify-between items-center px-8 pt-3 text-white text-xs font-semibold tracking-tight" data-purpose="ios-status-bar">
<span>9:41</span>
<!-- Notch / Dynamic Island simulated area -->
<div class="w-28 h-4 rounded-full bg-black/40"></div>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.5 2 14.36 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.36-.89 4.5-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5 0 1.25.46 2.39 1.22 3.28l.71-.71C8.36 13.93 8 13.01 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.01-.36 1.93-.93 2.57l.71.71C16.54 14.39 17 13.25 17 12c0-2.76-2.24-5-5-5zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.25c3.6 0 6.94 1.34 9.5 3.56L12 19.34 2.5 10.81c2.56-2.22 5.9-3.56 9.5-3.56z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-white rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-white rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: ProfileBottomSheet -->
<section class="mt-auto relative z-40 bg-[#0E1622] rounded-t-[36px] border-t border-[#1F2E43] px-6 pt-3 pb-8 shadow-2xl flex flex-col" data-purpose="profile-bottom-sheet">
<!-- Grabber Drag Handle -->
<div class="w-10 h-1 bg-slate-600/70 rounded-full mx-auto mt-1 mb-6" data-purpose="drag-indicator"></div>
<!-- Officer Profile Header Info -->
<div class="flex items-center space-x-4 mb-6" data-purpose="officer-profile-info">
<!-- Avatar with Subtle Ring -->
<div class="relative w-14 h-14 rounded-full overflow-hidden ring-2 ring-[#223348] flex-shrink-0 bg-slate-800">
<img alt="Officer Raya avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2Et2sFLyAdaO7gfFNbF9lx-RSC1eaHzeZMrd9Rc42jXP_yiH1ZJt6sIlSxSzODBw6UvnK9Dy-tOHtU-LOUQNCsbQcg5ir7qc0izQnlvtHjTVwz8QOqGt_0lXPECmWyI5lvViJqjzhMIuCANAC3Sy6M5B9nByjU2MgKz7C3j8G6yi02F3DXYn-4tsSSBJvqxX7B7rKktlxPK-y-HRUqX7NZhnRE1R7xiwHu1b06LE78IWn37vVvk71wA"/>
</div>
<!-- Officer Name & Handle -->
<div class="flex flex-col">
<h2 class="text-white text-lg font-bold tracking-tight">Raya</h2>
<span class="text-[#728296] text-xs font-normal">raya23</span>
</div>
</div>
<!-- Separator / Row Group -->
<div class="flex flex-col space-y-3.5 mb-6" data-purpose="profile-settings-list">
<!-- Checkpoint Selection Row -->
<div class="flex items-center justify-between py-2 text-sm border-b border-[#162333]/70 pb-3.5" data-purpose="checkpoint-row">
<div class="flex items-center space-x-3 text-slate-300">
<!-- Terminal/Checkpoint outline icon -->
<svg class="w-5 h-5 text-[#728296]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[#8B99AA] font-normal text-[13px]">Checkpoint</span>
</div>
<span class="text-white text-xs font-medium">Gate 1</span>
</div>
<!-- Connection Status Row -->
<div class="flex items-center justify-between py-2 text-sm" data-purpose="connection-status-row">
<div class="flex items-center space-x-3 text-slate-300">
<!-- Wifi Icon -->
<svg class="w-5 h-5 text-[#728296]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[#8B99AA] font-normal text-[13px]">Connection</span>
</div>
<div class="flex items-center space-x-1.5">
<span class="text-[#10B981] text-xs font-medium">Online</span>
</div>
</div>
</div>
<!-- Action Button: Logout -->
<button class="w-full py-3.5 px-4 bg-[#141F2D] hover:bg-[#1A283B] active:scale-[0.99] transition-all rounded-xl border border-[#213144] flex items-center justify-center space-x-2 text-slate-200 focus:outline-none" data-purpose="logout-action-button" type="button">
<!-- Logout / Exit Icon -->
<svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-xs font-semibold tracking-wide">Logout</span>
</button>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-slate-600/50 rounded-full mx-auto mt-6" data-purpose="ios-home-indicator"></div>
</section>
<!-- END: ProfileBottomSheet -->
</main>
<!-- END: DeviceContainer -->
</body></html>
